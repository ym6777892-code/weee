<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wedding Invitation | دعوة زفاف</title>
  <meta name="description" content="You are invited to our wedding. Open the invitation for the date, venue and details. | أنتم مدعوون إلى حفل زفافنا.">
  <meta name="theme-color" content="#faf6ee">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Wedding Invitation | دعوة زفاف">
  <meta property="og:description" content="You are invited to our wedding. | أنتم مدعوون إلى حفل زفافنا.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23faf6ee'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='none' stroke='%23a98a58' stroke-width='1.5'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>.loader{display:none}.cover{display:none}body.is-locked{overflow:auto}</style></noscript>
</head>
<body class="is-locked">

  <!-- Loading screen -->
  <div class="loader" id="loader" aria-hidden="true">
    <svg viewBox="0 0 56 56"><path d="M28 4 L52 28 L28 52 L4 28 Z"/></svg>
  </div>

  <!-- Invitation cover -->
  <div class="cover" id="cover">
    <div class="panel panel--l"></div>
    <div class="panel panel--r"></div>
    <div class="cover__content" id="coverContent">
      <div class="seal"><i></i></div>
      <p class="label" data-i18n="coverLabel"></p>
      <h1 class="cover__title">
        <span data-i18n="coverTitle1"></span>
        <span class="alt" data-i18n="coverTitle2"></span>
      </h1>
      <p class="cover__names" id="coverNames" hidden></p>
      <button class="btn btn--solid" id="openBtn" type="button" data-i18n="open"></button>
    </div>
  </div>

  <!-- Invitation -->
  <main id="invitation" inert tabindex="-1">

    <section class="section hero" id="hero" hidden>
      <p class="eyebrow reveal" data-i18n="ofWedding"></p>
      <h2 class="names reveal" id="names" style="--d:.1s">
        <span id="groom"></span>
        <span class="amp" id="amp" aria-hidden="true">&amp;</span>
        <span id="bride"></span>
      </h2>
      <div class="orn reveal" style="--d:.2s" aria-hidden="true"><i></i><b></b><i></i></div>
      <p class="lead reveal" id="invitationMessage" style="--d:.3s" hidden></p>
      <span class="scroll-cue" id="scrollCue" aria-hidden="true" hidden></span>
    </section>

    <section class="section section--dark" id="date" hidden>
      <div class="section__inner">
        <p class="eyebrow reveal" data-i18n="saveTheDate"></p>
        <p class="date-main reveal" id="dateText" style="--d:.1s" hidden></p>
        <p class="time-main reveal" id="timeText" style="--d:.2s" hidden></p>
        <div class="countdown reveal" id="countdown" style="--d:.3s" role="timer" hidden>
          <div class="cd-unit"><span class="cd-num" data-unit="days">00</span><span class="cd-label" data-i18n="days"></span></div>
          <div class="cd-unit"><span class="cd-num" data-unit="hours">00</span><span class="cd-label" data-i18n="hours"></span></div>
          <div class="cd-unit"><span class="cd-num" data-unit="minutes">00</span><span class="cd-label" data-i18n="minutes"></span></div>
          <div class="cd-unit"><span class="cd-num" data-unit="seconds">00</span><span class="cd-label" data-i18n="seconds"></span></div>
        </div>
      </div>
    </section>

    <section class="section section--beige" id="venue" hidden>
      <div class="section__inner">
        <div class="seal seal--sm reveal"><i></i></div>
        <p class="eyebrow reveal" data-i18n="venue" style="--d:.1s"></p>
        <h2 class="h2 reveal" id="venueName" style="--d:.15s" hidden></h2>
        <p class="addr reveal" id="venueAddress" style="--d:.2s" hidden></p>
        <a class="btn reveal" id="directions" style="--d:.3s" target="_blank" rel="noopener noreferrer" hidden data-i18n="directions"></a>
      </div>
    </section>

    <section class="section" id="schedule" hidden>
      <div class="section__inner">
        <p class="eyebrow reveal" data-i18n="schedule"></p>
        <ol class="schedule reveal" id="scheduleList" style="--d:.1s"></ol>
      </div>
    </section>

    <section class="section section--beige" id="message" hidden>
      <div class="section__inner">
        <div class="orn reveal" aria-hidden="true"><i></i><b></b><i></i></div>
        <p class="note reveal" id="personalMessage" style="--d:.1s"></p>
      </div>
    </section>

    <section class="section section--dark" id="rsvp" hidden>
      <div class="section__inner">
        <p class="eyebrow reveal" data-i18n="rsvp"></p>
        <p class="rsvp-text reveal" id="rsvpText" style="--d:.1s"></p>
      </div>
    </section>

    <!-- Shown only while config.js is still empty -->
    <section class="section setup" id="setup" hidden>
      <div class="section__inner">
        <p class="eyebrow" data-i18n="setupTitle"></p>
        <p class="setup__text" data-i18n="setupText"></p>
      </div>
    </section>

  </main>

  <!-- Floating controls -->
  <div class="controls" id="controls" hidden>
    <button class="ctrl ctrl--music" id="musicBtn" type="button" hidden>
      <span class="eq" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <button class="ctrl ctrl--lang" id="langBtn" type="button"></button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
